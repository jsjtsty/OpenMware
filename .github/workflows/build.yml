name: Build

# Builds the engine and the launchers for every platform (no game data is involved or shipped). All third-party code (SDL3,
# zstd, libwebp, stb, FFmpeg) is fetched as source and compiled by CMake, see cmake/Dependencies.cmake and cmake/FFmpeg.cmake;
# the shaders are the checked-in ones under shaders/prebuilt. The scripts do the real work, so every step can be run locally:
#   windows  OpenMware.exe (Qt launcher) + openmware-player.exe; Vulkan + Direct3D 12   build: cmake -DOMW_BUILD_LAUNCHER=ON
#   linux    openmware (Qt launcher) + openmware-player, Vulkan, tar.gz                  build: cmake + scripts/linux/package.sh
#   macos    OpenMware.app: SwiftUI launcher + openmware-player, Metal, ad-hoc signed   build: scripts/apple/build.sh macos
#   ios      unsigned OpenMware.ipa: SwiftUI launcher with libmware in-process, Metal   build: scripts/apple/build.sh ios
#   android  OpenMware APK: Compose launcher + SDL activity, Vulkan, arm64-v8a          build: scripts/android/build.sh
# Only the Windows build has been run on real hardware; expect to iterate on the others.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # FFmpeg's configure/make needs a POSIX shell; MSYS2 only provides the shell, make and nasm, MSVC compiles.
      - uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: MSYS
          update: false
          install: make diffutils nasm

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Keep MSYS2's link.exe from shadowing MSVC's
        shell: pwsh
        run: |
          $root = '${{ steps.msys.outputs.msys2-location }}'
          Rename-Item "$root/usr/bin/link.exe" link.exe.bak -ErrorAction SilentlyContinue
          "OMW_MSYS2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The launcher (launcher/qt) uses Qt as shared libraries (LGPL); windeployqt copies them next to it.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOMW_BUILD_LAUNCHER=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: build/test_easing.exe

      - name: Package
        shell: pwsh
        run: |
          $out = 'dist/OpenMware-windows-x64'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/OpenMware.exe, build/openmware-player.exe, build/npktool.exe $out
          Copy-Item build/*.dll $out   # FFmpeg (LGPL) stays a set of DLLs next to the program
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-compiler-runtime "$out/OpenMware.exe"
          Copy-Item -Recurse build/ffmpeg-install/licenses "$out/licenses"
          Copy-Item launcher/qt/dist/QT-NOTICE.txt "$out/licenses/"
          Copy-Item docs/third-party.md "$out/licenses/THIRD-PARTY.md"
          # Windows GPUs take SPIR-V (Vulkan) or DXIL (Direct3D 12); both sets were copied next to the executable.
          Copy-Item -Recurse build/shaders "$out/shaders"
          Copy-Item docs/running.md "$out/README.md"
          Compress-Archive -Path "$out/*" -DestinationPath dist/OpenMware-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMware-windows-x64
          path: dist/OpenMware-windows-x64.zip

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # SDL3's development packages, FFmpeg's build tools and Qt 6 (the launcher links the distribution's Qt dynamically).
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm pkg-config qt6-base-dev libgl1-mesa-dev libvulkan-dev \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libegl1-mesa-dev libdbus-1-dev \
            libudev-dev libwayland-dev libdecor-0-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOMW_BUILD_LAUNCHER=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: build/test_easing

      - name: Package
        run: bash scripts/linux/package.sh build

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMware-linux-x64
          path: dist/OpenMware-linux-x64.tar.gz

  macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: brew install ninja xcodegen

      # Xcode 26 ships the Metal compiler as a separate download; without it the MSL source is shipped instead of .metallib.
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Engine tests
        run: |
          cmake -S . -B build/tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DOMW_BUILD_LIBRARY=OFF
          cmake --build build/tests --target test_easing
          build/tests/test_easing

      - name: Launcher app
        run: bash scripts/apple/build.sh macos

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMware-macos-arm64
          path: dist/OpenMware-macos-arm64.zip

  android:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # The runner image already has the Android SDK and an NDK.
      - name: SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME  NDK=$ANDROID_NDK_LATEST_HOME"
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # A fixed signing key keeps updates installable. Secrets: ANDROID_KEYSTORE_BASE64 (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, optionally ANDROID_KEY_PASSWORD. Without them (forks) the build falls back to a throwaway debug key.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/openmware.jks"
            echo "OMW_KEYSTORE_FILE=$RUNNER_TEMP/openmware.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK gets a random debug signature and cannot update an earlier build"
          fi

      - name: App
        env:
          OMW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OMW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OMW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/android/build.sh debug

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMware-android-arm64
          path: dist/OpenMware-android-arm64-debug.apk

  ios:
    name: iOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: brew install xcodegen

      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Launcher app (unsigned)
        run: bash scripts/apple/build.sh ios

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMware-ios-arm64
          path: dist/OpenMware-ios-arm64-unsigned.ipa

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OpenMware-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
